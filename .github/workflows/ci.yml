name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format check
        run: test -z "$(gofmt -l $(find . -name '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Linux AMD64 build
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/sigwatch-linux-amd64 ./cmd/sigwatch
      - name: Linux ARM64 build
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/sigwatch-linux-arm64 ./cmd/sigwatch

