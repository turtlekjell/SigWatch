title: "SigWatch"
listen: "127.0.0.1:8080"
theme: "default"
default_region: "southwest"
freshness:
  warning_after: "15m"
  expire_after: "1h"
regions:
  prototype:
    label: "Prototype"
    widgets:
      - id: "radar"
        type: "image"
        title: "Orange County Radar"
        url: "https://radar.weather.gov/ridge/standard/KSOX_loop.gif"
        attribution: "NOAA / National Weather Service"
        refresh: "2m"
        width: 2
        height: 2
        freshness:
          warning_after: "10m"
          expire_after: "30m"

      - id: "socal-earthquakes"
        type: "earthquake"
        title: "Southern California Earthquakes"
        latitude: 34.05
        longitude: -118.25
        max_radius_km: 300
        min_magnitude: 1.5
        hours: 24
        max_events: 8
        refresh: "2m"
        width: 2
        height: 2

      - id: "socal-fires"
        type: "fire"
        title: "Southern California Wildfires"
        latitude: 33.66
        longitude: -117.99
        max_radius_km: 4300
        max_events: 8
        named_only: true
        min_acres: 1
        refresh: "5m"
        width: 2
        height: 2

      - id: "live-camera-test"
        type: "camera"
        title: "Live Camera Test"
        url: "https://www.youtube.com/live/SHfAtWHr9Ks"
        autoplay: true
        muted: true
        controls: true
        width: 2
        height: 2

      - id: "hb-coastal"
        type: "coastal"
        title: "Beach Forecast and Tides"
        latitude: 33.66
        longitude: -117.99
        timezone: "America/Los_Angeles"
        tide_station: "9410580"
        forecast_days: 7
        units: "imperial"
        refresh: "30m"
        width: 2
        height: 2

      - id: "weather"
        type: "weather"
        title: "Weather"
        latitude: 33.6595
        longitude: -117.9988
        units: "imperial"
        refresh: "10m"
        width: 2
        height: 1
      - id: "local-clock"
        type: "clock"
        title: "Pacific Time"
        timezone: "America/Los_Angeles"
        width: 1
        height: 1
      - id: "utc"
        type: "clock"
        title: "UTC"
        timezone: "UTC"
        width: 1
        height: 1
      - id: "system"
        type: "system"
        title: "Host Status"
        refresh: "10s"
        width: 2
        height: 1
      - id: "links"
        type: "links"
        title: "Sources"
        width: 2
        height: 1
        links:
          - label: "NWS"
            url: "https://www.weather.gov/"
          - label: "USGS Earthquakes"
            url: "https://earthquake.usgs.gov/"
          - label: "CAL FIRE"
            url: "https://www.fire.ca.gov/"
  national:
    label: "National / Radio"
    layout: viewport
    columns: 4
    rows: 3
    widgets:

      # TILE 1
      - id: "conus-radar"
        type: "image"
