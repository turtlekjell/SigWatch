        width: 1
        height: 1

      # TILE 11
      - id: "national-system"
        type: "system"
        title: "SigWatch Host"
        refresh: "10s"
        width: 1
        height: 1

      # TILE 12
      - id: "radio-links"
        type: "links"
        title: "Radio / Space Weather"
        width: 1
        height: 1
        links:
          - label: "NOAA SWPC"
