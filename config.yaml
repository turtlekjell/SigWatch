title: "SigWatch"
listen: "127.0.0.1:8080"
theme: "default"
default_region: "prototype"
freshness:
  warning_after: "15m"
  expire_after: "1h"
regions:
  prototype:
    label: "Prototype"
    widgets:
      - id: "radar"
        type: "image"
        title: "Orange County Radar"
        url: "https://radar.weather.gov/ridge/standard/KSOX_loop.gif"
        attribution: "NOAA / National Weather Service"
        refresh: "2m"
        width: 2
        height: 2
        freshness:
          warning_after: "10m"
          expire_after: "30m"

      - id: "socal-earthquakes"
        type: "earthquake"
        title: "Southern California Earthquakes"
        latitude: 34.05
        longitude: -118.25
        max_radius_km: 300
        min_magnitude: 1.5
        hours: 24
        max_events: 8
        refresh: "2m"
        width: 2
        height: 2

      - id: "socal-fires"
        type: "fire"
        title: "Southern California Wildfires"
        latitude: 33.66
        longitude: -117.99
        max_radius_km: 4300
        max_events: 8
        named_only: true
        min_acres: 1
        refresh: "5m"
        width: 2
        height: 2

      - id: "live-camera-test"
        type: "camera"
        title: "Live Camera Test"
        url: "https://www.youtube.com/live/SHfAtWHr9Ks"
        autoplay: true
        muted: true
        controls: true
        width: 2
        height: 2

      - id: "weather"
        type: "weather"
        title: "Weather"
        latitude: 33.6595
        longitude: -117.9988
        units: "imperial"
        refresh: "10m"
        width: 2
        height: 1
      - id: "local-clock"
        type: "clock"
        title: "Pacific Time"
        timezone: "America/Los_Angeles"
        width: 1
        height: 1
      - id: "utc"
        type: "clock"
        title: "UTC"
        timezone: "UTC"
        width: 1
        height: 1
      - id: "system"
        type: "system"
        title: "Host Status"
        refresh: "10s"
        width: 2
        height: 1
      - id: "links"
        type: "links"
        title: "Sources"
        width: 2
        height: 1
        links:
          - label: "NWS"
            url: "https://www.weather.gov/"
          - label: "USGS Earthquakes"
            url: "https://earthquake.usgs.gov/"
          - label: "CAL FIRE"
            url: "https://www.fire.ca.gov/"
  maps:
    label: "Maps"
    widgets:

      - id: "conus-radar"
        type: "image"
        title: "RADAR"
        url: "https://radar.weather.gov/ridge/standard/CONUS_loop.gif"
        refresh: "2m"
        width: 1
        height: 1

      - id: "national-forecast"
        type: "image"
        title: "NATIONAL FORECAST"
        url: "https://www.wpc.ncep.noaa.gov//noaa/noaa.gif"
        refresh: "15m"
        width: 1
        height: 1

      - id: "us-warnings"
        type: "image"
        title: "US WEATHER WARNINGS"
        url: "https://www.weather.gov/wwamap/png/US.png"
        refresh: "5m"
        width: 1
        height: 1

      - id: "kansas-satellite"
        type: "image"
        title: "KANSAS SATELLITE"
        url: "https://cdn.star.nesdis.noaa.gov/GOES16/GLM/SECTOR/umv/EXTENT3/GOES16-UMV-EXTENT3-600x600.gif"
        refresh: "5m"
        width: 1
        height: 1

      - id: "local-radar"
        type: "image"
        title: "LOCAL RADAR"
        url: "https://radar.weather.gov/ridge/standard/KEYX_loop.gif"
        refresh: "2m"
        width: 1
        height: 1

      - id: "local-satellite"
        type: "image"
        title: "LOCAL SATELLITE"
        url: "https://cdn.star.nesdis.noaa.gov/GOES18/GLM/SECTOR/psw/EXTENT3/GOES18-PSW-EXTENT3-600x600.gif"
        refresh: "5m"
        width: 1
        height: 1

      - id: "lightning-local"
        type: "image"
        title: "LIGHTNING LOCAL"
        url: "https://www.blitzortung.org/en/Images/image_b_ca.png"
        refresh: "2m"
        width: 1
        height: 1

      - id: "lightning-usa"
        type: "image"
        title: "LIGHTNING"
        url: "https://images.lightningmaps.org/blitzortung/america/index.php?animation=usa"
        refresh: "2m"
        width: 1
        height: 1

      - id: "local-precipitation"
        type: "image"
        title: "LOCAL PRECIPITATION"
        url: "https://graphical.weather.gov/GraphicalNDFD.php?width=515&timezone=PDT&sector=PACSOUTHWEST&element=wx&n=5"
        refresh: "10m"
        width: 1
        height: 1

      - id: "grey-line"
        type: "image"
        title: "GREY LINE"
        url: "https://www.timeanddate.com/scripts/sunmap.php?iso=now"
        refresh: "5m"
        width: 1
        height: 1

      - id: "10m-propagation"
        type: "image"
        title: "10M PROPAGATION"
        url: "https://www.tvcomm.co.uk/g7izu/Autosave/NA_ES_AutoSave.JPG"
        refresh: "5m"
        width: 1
        height: 1

      - id: "hf-propagation"
        type: "image"
        title: "HF PROPAGATION"
        url: "https://www.hamqsl.com/solar101vhf.php"
        refresh: "5m"
        width: 1
        height: 1